<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Weather App</h1>
        <p class="subtitle">Check the weather in your city</p>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name...">
            <button id="searchBtn">Search</button>
        </div>

        <div class="weather-card">

            <h2 id="cityName">Baku</h2>
            <p class="weather-description" id="weatherDescription">Sunny</p>

            <div class="weather-icon" id="weatherImage">
                ☀️
            </div>

            <h1 class="temperature" id="temperature">24°C</h1>

            <p class="feels-like">Feels like <span id="feelsLike">26°C</span></p>

            <div class="weather-details">

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <h3 id="humidity">45%</h3>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <h3 id="windSpeed">12 km/h</h3>
                </div>

            </div>

        </div>

        <p id="errorMessage"></p>

    </div>

    <script src="index.js"></script>
</body>

</html>
